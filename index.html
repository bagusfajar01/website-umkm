<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kopi Nusa - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">UMKM Pekalongan</p>
        <h1>Kopi Nusa</h1>
        <p>Kopi lokal pilihan untuk teman belajar, bekerja, dan berdiskusi.</p>
        <button id="promoButton" type="button">Lihat promo hari ini</button>
      </section>

      <section aria-labelledby="produk-title">
        <h2 id="produk-title">Produk Unggulan</h2>
        <ul class="products">
          <li>Kopi Tubruk Signature - Rp18.000</li>
          <li>Cold Brew Aren - Rp22.000</li>
        </ul>
      </section>

      <section class="info" aria-labelledby="info-title">
        <h2 id="info-title">Jam Buka dan Lokasi</h2>
        <p><strong>Jam Buka:</strong> Senin - Sabtu, 08.00 - 21.00</p>
        <p><strong>Lokasi:</strong> Pekalongan, Jawa Tengah</p>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
